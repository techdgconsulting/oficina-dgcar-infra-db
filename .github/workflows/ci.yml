name: Infra DB

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main
      - homolog
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      environment:
        description: "Target environment"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - prod

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Disable remote backend for offline validation
        working-directory: terraform
        run: mv backend.tf backend.tf.disabled

      - name: Terraform init without remote state
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan without refresh
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'homolog' }}
          TF_VAR_vpc_id: ${{ secrets.VPC_ID || 'vpc-12345678' }}
          TF_VAR_private_subnet_ids: ${{ secrets.PRIVATE_SUBNET_IDS || '["subnet-12345678","subnet-87654321"]' }}
          TF_VAR_allowed_security_group_ids: ${{ secrets.ALLOWED_DB_SECURITY_GROUP_IDS || '["sg-12345678"]' }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME || 'oficina' }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD || 'change-me' }}
          TF_VAR_db_instance_class: ${{ (github.base_ref || github.ref_name) == 'main' && 'db.t4g.micro' || 'db.t3.micro' }}
          TF_VAR_db_storage_type: ${{ (github.base_ref || github.ref_name) == 'main' && 'gp3' || 'gp2' }}
          TF_VAR_backup_retention_period: ${{ (github.base_ref || github.ref_name) == 'main' && '7' || '0' }}
        run: terraform plan -refresh=false

  apply:
    name: apply
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform init with remote state
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.PRIVATE_SUBNET_IDS }}
          TF_VAR_allowed_security_group_ids: ${{ secrets.ALLOWED_DB_SECURITY_GROUP_IDS }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_instance_class: ${{ inputs.environment == 'prod' && 'db.t4g.micro' || 'db.t3.micro' }}
          TF_VAR_db_storage_type: ${{ inputs.environment == 'prod' && 'gp3' || 'gp2' }}
          TF_VAR_backup_retention_period: ${{ inputs.environment == 'prod' && '7' || '0' }}
        run: terraform apply -auto-approve

      - name: Publish database outputs to Lambda repository
        working-directory: terraform
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          AUTH_LAMBDA_REPO: techdgconsulting/oficina-dgcar-auth-lambda
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          DB_HOST="$(terraform output -raw rds_endpoint)"
          DB_PORT="$(terraform output -raw rds_port)"
          DB_NAME="$(terraform output -raw db_name)"

          gh secret set DB_HOST --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$DB_HOST"
          gh secret set DB_PORT --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$DB_PORT"
          gh secret set DB_NAME --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$DB_NAME"
          gh secret set DB_USERNAME --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$DB_USERNAME"
          gh secret set DB_PASSWORD --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$DB_PASSWORD"
          gh secret set DB_SSL --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "true"
